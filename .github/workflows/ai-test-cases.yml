# Pipeline stage 1-3: Jira ticket -> test cases -> pull request.
#
# The pull request this opens is the human review gate. Nothing downstream runs
# until someone approves it, which is the point: a reviewer corrects the test
# design while it is still cheap markdown, before any code exists.
name: AI · Test cases from ticket

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Jira issue key, e.g. SUR-1
        required: true
        type: string
  # Lets a Jira automation rule kick the pipeline off on a status transition:
  #   POST /repos/:owner/:repo/dispatches
  #   { "event_type": "jira-ticket-ready", "client_payload": { "ticket": "SUR-1" } }
  repository_dispatch:
    types: [jira-ticket-ready]

permissions:
  contents: write
  pull-requests: write

jobs:
  design:
    runs-on: ubuntu-latest
    env:
      TICKET: ${{ inputs.ticket || github.event.client_payload.ticket }}
      BRANCH: ai/test-cases/${{ inputs.ticket || github.event.client_payload.ticket }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm install -g @anthropic-ai/claude-code

      # Re-running a ticket that already has an open review branch continues
      # that branch rather than replacing it, so a reviewer's edits stay in the
      # history and the new version arrives as a diff they can read.
      - name: Check out the review branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout "$BRANCH" 2>/dev/null || git checkout -b "$BRANCH"

      - name: Fetch the ticket
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: node scripts/jira-fetch.js "$TICKET"

      - name: Design the test cases
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/ai-test-cases.sh "$TICKET"

      - name: Commit
        id: commit
        run: |
          set -euo pipefail
          git add ".ai/tickets/${TICKET}.json" "test-cases/${TICKET}.md"

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Test cases for ${TICKET} are unchanged — nothing to review."
            exit 0
          fi

          git commit -m "test(${TICKET}): design test cases from the ticket"
          git push origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Write the pull request body
        if: steps.commit.outputs.changed == 'true'
        run: |
          cat > /tmp/pr-body.md <<'BODY'
          Generated by the `test-case-designer` skill from the ticket snapshot in
          `.ai/tickets/`.

          **Review the coverage, not the prose.** Is anything in the ticket untested?
          Is every expected result something you could actually observe? Is each
          `Automate: yes` honest — could a headless run really check it?

          Edit the markdown directly if a case is wrong. The spec is generated from
          this approved file, not from the ticket, so your edits are what gets built.

          Approving this pull request runs the automation stage: it writes a Cypress
          spec for every case marked `Automate: yes`, pushes it here, and posts the
          run results as a comment.
          BODY

      - name: Open or update the pull request
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr comment "$BRANCH" \
              --body "Test cases regenerated from the latest version of ${TICKET}. Please re-review the diff."
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH" \
              --title "${TICKET}: test cases for review" \
              --label "ai-test-cases" \
              --body-file /tmp/pr-body.md
          fi
